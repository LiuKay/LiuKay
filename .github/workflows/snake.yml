name: Generate Contribution Snake

on:
  # 每天自动运行一次
  schedule:
    - cron: "0 0 * * *"

  # 允许在 Actions 页面手动运行
  workflow_dispatch:

  # 修改 master 分支时也运行
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00bfff&color_dots=#ebedf0,#b6e3ff,#54aeff,#0969da,#0a3069
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00e5ff&color_dots=#161b22,#0e3049,#0969da,#1f6feb,#54aeff

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
